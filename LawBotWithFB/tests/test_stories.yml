      chào
    intent: greet
  - action: utter_greet
  - user: |
      anh là Đức
    intent: give_name
  - action: utter_greet_with_name


- story: Người dùng tự xưng hô đầu tiên rồi tạm biệt
  steps:
  - user: |
      Anh Tú
    intent: give_name
  - action: utter_greet_with_name
  - user: |
      hẹn gặp lại
    intent: goodbye
  - action: utter_goodbye

- story: Người dùng tự xưng hô đầu tiên rồi hỏi toàn bộ chức năng
