stories:
- story: Chào rồi tạm biệt
  steps:
  - user: |
      chào
    intent: greet
  - action: utter_greet
  - user: |
      hẹn gặp lại
    intent: goodbye
  - action: utter_goodbye


- story: Chào rồi hỏi cách xưng hô
