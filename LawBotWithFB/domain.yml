entities:
  - cust_name
  - cust_sex

slots:
  cust_sex:
    type: text
    mappings:
      - type: from_entity
        entity: cust_sex

  cust_name:
    type: text
    mappings:
      - type: from_entity
        entity: cust_name


responses:

  utter_greet:
  - text: "Xin chào Quý khách, Quý khách vui lòng cho LawBot biết quý danh để tiện xưng hô ạ?"

  utter_greet_with_name:
  - text: "Xin chào {cust_sex} {cust_name}. LawBot có thể giúp gì được {cust_sex} {cust_name} ạ?"

  utter_goodbye:
  - text: "Cảm ơn {cust_sex} {cust_name} đã dành thời gian cho em. Hẹn gặp lại {cust_sex} {cust_name} lần sau!"
  - text: "Kính chào tạm biệt và chúc {cust_sex} {cust_name} một ngày tốt lành!"

  utter_ask_article:
  - text: "Xin mời {cust_sex} {cust_name} nhập vào tiêu đề luật để tìm kiếm nội dung"



#  utter_advise_harm_people:
